name: Build Android TV APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/BaiturRahmanMosqueTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BaiturRahmanMosqueTV-APK
          path: output/BaiturRahmanMosqueTV.apk
